name: Daily Java Job Refresh

on:

  # Every day at 9:00 AM IST
  # 03:30 UTC = 09:00 IST
  schedule:
    - cron: "30 3 * * *"

  # Manual trigger
  workflow_dispatch:


permissions:
  contents: write


jobs:

  refresh-jobs:

    runs-on: ubuntu-latest


    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt


      # ==========================================
      # 4. FETCH LATEST JOBS
      # ==========================================

      - name: Fetch latest Java jobs

        env:

          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}

          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}

          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

        run: |

          python job_radar.py


      # ==========================================
      # 5. COMMIT UPDATED DATA
      # ==========================================

      - name: Commit updated job data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jobs.json

          git add data/meta.json

          git add data/lever_seen.json

          if git diff --cached --quiet; then

            echo "No changes found."

          else

            git commit -m "Daily multi-source job refresh"

            git push

          fi